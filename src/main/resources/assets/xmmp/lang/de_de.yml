            name: "Teamkarte empfangen"
            description: "Erkundung des eigenen FTB-Teams empfangen, wenn TEAM oder GLOBAL gewählt wurde"
          receiveGlobalTerrain:
            name: "Globale Karte empfangen"
            description: "Öffentlich freigegebene Erkundung empfangen, wenn TEAM oder GLOBAL gewählt wurde"
      admin:
        name: "Server-Administration (nur OP)"
        options:
          allowTeam:
            name: "Teamkarten erlauben"
            description: "Neue Übertragungen für Teamkarten sofort sperren oder erlauben. Erneute Verbindung empfohlen."
          allowGlobal:
            name: "Globale Karten erlauben"
            description: "Neue Übertragungen für globale Karten sofort sperren oder erlauben. Erneute Verbindung empfohlen."
          allowUploads:
            name: "Uploads erlauben"
            description: "Sperrt oder erlaubt neue Karten-Uploads, ohne gespeicherte Karten zu löschen"
      world:
        name: "Welteinstellungen"
        options:
          serverAddress:
            name: "Serveradresse"
            description: "Adresse des eigenständigen Servers (Host:Port)"
