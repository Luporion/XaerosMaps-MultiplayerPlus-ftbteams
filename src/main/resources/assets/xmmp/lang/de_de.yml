xmmp:
  config:
    title: "Xaero Maps: Multiplayer+ Einstellungen"
    categories:
      general:
        name: "Allgemein"
        options:
          flushInterval:
            name: "Speicherintervall"
            description: "Intervall für den Karten-Synchronisationsstand in Millisekunden"
          checkUpdate:
            name: "Auf Updates prüfen"
            description: "Automatisch nach Updates suchen"
          downloadWindow:
            name: "Parallele Downloads"
            description: "Maximale Anzahl gleichzeitiger Karten-Downloads"
      sharing:
        name: "Kartenerkundung teilen"
