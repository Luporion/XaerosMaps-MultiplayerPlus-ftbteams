name: Rogler XMMP v0.4.0 NeoForge Build
on:
  push:
    branches: [main, 'feat/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scoped-sharing:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate Actions monitor scripts
        run: python3 scripts/test-build-monitor.py
      - name: Parse PowerShell monitor (syntax)
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/watch-actions.ps1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_ }
            exit 1
          }
      - name: Check multi-scope privacy and provenance guards
        run: python3 scripts/verify-provenance.py
      - name: Check v0.4.0 in-game permission settings
        run: python3 scripts/verify-v040-settings.py
      - name: Verify non-empty Gradle/JUnit test discovery
        run: python3 scripts/verify-test-discovery.py
      # Both suites must actually execute; Gradle 9 fails if no tests are discovered.
      - name: Build Minecraft 1.21.1 NeoForge and run JUnit tests
        run: ./gradlew :1.21.1-neoforge:build :core:test --no-parallel --no-daemon
      - name: Upload DEV source-tested JAR
        uses: actions/upload-artifact@v4
        with:
          name: rogler-xmmp-0.4.0-unverified-runtime
          path: versions/1.21.1-neoforge/build/libs/*.jar
          if-no-files-found: error
